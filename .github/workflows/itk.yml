# Runs the A2A Integration Test Kit (cross-SDK interoperability) against the feature-pack.
# The ITK service builds and starts the itk module as the Java SDK's "current" agent, see itk/run_itk.sh.
# Based on https://github.com/wildfly-extras/a2a-jakarta/blob/main/.github/workflows/itk.yml

name: ITK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  itk:
    name: ITK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clone a2a-itk
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service
      - name: Cache launcher peer-SDK checkouts + build outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-
      - name: Run ITK
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: main
          ITK_SKIP_BUILD: "1"
          ITK_LOG_LEVEL: DEBUG
          ITK_BUILD_TIMEOUT: 1800
      - name: Upload ITK agent logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: itk-agent-logs
          path: itk/logs/
          retention-days: 5
          if-no-files-found: ignore
