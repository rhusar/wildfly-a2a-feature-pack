# Runs the A2A protocol v1.0 TCK against the feature-pack.
# The v0.3 TCK lives in tck-0.3.yml.
# Based on https://github.com/wildfly-extras/a2a-jakarta/blob/main/.github/workflows/run-tck.yml

name: Build and Run TCK 1.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

env:
  # Ref (branch/tag/SHA) of the TCK
  # https://github.com/a2aproject/a2a-tck
  TCK_VERSION: 1.0.0.alpha2
  UV_SYSTEM_PYTHON: 1
  # Env vars to configure SUT hosts
  SUT_HOST: localhost:8080
  SUT_GRPC_HOST: localhost:9555

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Run TCK 1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Checkout a2a-tck
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-tck
          path: a2a-tck
          ref: ${{ env.TCK_VERSION }}
      - name: Build the feature-pack and provision the v1.0 TCK server
        run: ./mvnw --batch-mode --no-transfer-progress install
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "a2a-tck/pyproject.toml"
      - name: Install uv and Python dependencies
        run: |
          pip install uv
          uv pip install -e .
        working-directory: a2a-tck
      - name: Start the WildFly SUT
        run: |
          ./mvnw --batch-mode --no-transfer-progress --projects tck/tck-1.0 -Dstartup-timeout=120 -Dwildfly.serverArgs="--stability=experimental" wildfly:start
      - name: Verify agent card
        run: |
          echo "Agent card from http://${{ env.SUT_HOST }}/.well-known/agent-card.json:"
          curl -s http://${{ env.SUT_HOST }}/.well-known/agent-card.json | python3 -m json.tool
      - name: Run TCK
        id: run-tck
        timeout-minutes: 10
        run: |
          set -o pipefail
          uv run ./run_tck.py --sut-host http://${{ env.SUT_HOST }} -v 2>&1 | tee tck-output.log
        working-directory: a2a-tck
      - name: TCK Summary
        if: always() && steps.run-tck.outcome != 'skipped'
        run: |
          if [ -f a2a-tck/tck-output.log ]; then
            SUMMARY=$(sed -n '/^═══/,$p' a2a-tck/tck-output.log)
            if [ -n "$SUMMARY" ]; then
              echo '### TCK 1.0 Results' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Shutdown the WildFly SUT
        if: always()
        run: |
          ./mvnw --batch-mode --no-transfer-progress --projects tck/tck-1.0 wildfly:shutdown
      - name: Upload TCK Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-1.0-reports
          path: a2a-tck/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload tck-1.0 server.log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tck-1.0-server-log
          path: tck/tck-1.0/target/wildfly/standalone/log/server.log
          retention-days: 5
