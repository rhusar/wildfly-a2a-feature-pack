# Publishes the aggregated JaCoCo code coverage report to the gh-pages branch.

name: Code Coverage

on:
  push:
    branches:
      - main

# Required so the deploy action can push to the gh-pages branch.
permissions:
  contents: write

# Shares the Javadoc workflow's concurrency group on purpose: both deploy to gh-pages and would
# otherwise race on it. cancel-in-progress must stay false so runs queue instead of cancelling
# each other mid-deploy.
concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Don't publish from forks; only the canonical repository owns the docs site.
    if: github.repository == 'rhusar/wildfly-a2a-feature-pack'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # -Dcoverage (never -P, see the coverage-enabled profile in the root POM) instruments both the
      # test JVMs and the managed WildFly servers, so the full integration testsuite has to run to
      # produce the in-container data the aggregate report is built from.
      - name: Build with coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean install -Dcoverage

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage-test-reports
          path: |
            **/surefire-reports/*
            **/failsafe-reports/*
            **/standalone/log/*.log

      - name: Publish to gh-pages under coverage/${{ github.ref_name }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: code-coverage/target/site/jacoco-aggregate
          # Each branch/tag gets its own versioned folder; the action's clean
          # step is scoped to this target-folder, so sibling versions are kept.
          target-folder: coverage/${{ github.ref_name }}
