# See the jsonrpc module: the deployment provides no TaskAuthorizationProvider, and a2a-java is
# fail-closed without one.
a2a.authorization.required=false

# MicroProfile Telemetry is off per deployment unless this is set, and with it off the injected
# Tracer is a no-op one that records nothing for the A2A decorator to export.
otel.sdk.disabled=false
otel.service.name=a2a-opentelemetry-itest
# The logging exporter writes each finished span to the server log, which is what the test asserts
# on. Everything else is turned off so no exporter tries to reach a collector that is not there.
otel.traces.exporter=logging
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.sampler=always_on
# Default is 5s; the test would otherwise spend that long waiting for the batch processor to flush.
otel.bsp.schedule.delay=100
