# a2a-java 1.3.0.Final denies every task operation when no TaskAuthorizationProvider is configured
# (fail-closed). The SDK test application does not provide one - TestTaskAuthorizationProvider is
# deleted from the deployment - so the tests run with authorization enforcement turned off, the same
# way the upstream a2a-java test applications do in their application.properties.
a2a.authorization.required=false
