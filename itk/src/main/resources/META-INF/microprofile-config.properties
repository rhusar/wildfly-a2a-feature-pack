# The ITK agent has no TaskAuthorizationProvider, and a2a-java denies every task operation when none is
# configured (fail-closed).
a2a.authorization.required=false

# Push notifications enabled for ITK interoperability testing
a2a.push-notification.enabled=true
# Push notification URL validation relaxed for CI/testing:
# Allow http (ITK agents run plain HTTP on localhost)
a2a.push-notification.url.allowed-schemes=https,http
# Allow private/loopback targets (ITK agents listen on 127.0.0.1)
a2a.push-notification.url.allow-private-network-targets=true

# Every hop of a traversal holds an agent executor thread while it waits for the next agent, and the chain
# returns to this agent several times. In the feature-pack the deployment runs on the SDK's own executor rather
# than the container's ManagedExecutorService (a2a-jakarta's AsyncManagedExecutorServiceProducer is not selected
# when loaded from a JBoss module). That pool only grows past the core size once its queue is full, so the default
# core size of 5 starves nested calls until they time out.
a2a.executor.core-pool-size=50
